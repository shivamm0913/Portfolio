<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/dp2.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shivam Kewat — Software Engineer</title>
    <meta
      name="description"
      content="Shivam Kewat's portfolio — Software Engineer building scalable web applications with TypeScript, React, NestJS, and PostgreSQL."
    />
    <!-- Google Fonts preconnect for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@0;1&family=Inter:wght@300..700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("theme:mode");
          var root = document.documentElement;
          if (mode === "dark") root.classList.add("dark");
          else root.classList.remove("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
