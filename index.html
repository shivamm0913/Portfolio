<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/dp2.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shivam Kewat</title>
    <meta
      name="description"
      content="Shiva's modern portfolio built with React, Vite, Tailwind, and Framer Motion."
    />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("theme:mode");
          var root = document.documentElement;
          if (mode === "dark") root.classList.add("dark");
          else root.classList.remove("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
